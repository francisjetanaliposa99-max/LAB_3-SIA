<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: Arial; background:#eef4ff; padding:30px; }
    .container { max-width:800px; margin:auto; background:white; padding:25px; border-radius:12px; }
    button { padding:10px 14px; background:#123c8c; color:white; border:none; border-radius:6px; margin:5px; cursor:pointer; }
    pre { background:#f4f4f4; padding:15px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔐 Admin Dashboard</h2>
    <p id="welcome"></p>
    <button id="loadUsers">View All Users</button>
    <button id="logout">Logout</button>
    <pre id="output"></pre>
  </div>
  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token || user.role !== 'admin') {
      alert('Access Denied: Admin only');
      window.location.href = 'login.html';
    }
    document.getElementById('welcome').textContent = `Welcome Admin: ${user.username}`;
    async function callApi(url){
      const res = await fetch(url, {headers:{Authorization:`Bearer ${token}`}});
      const data = await res.json();
      document.getElementById('output').textContent = JSON.stringify(data,null,2);
    }
    document.getElementById('loadUsers').onclick = () => callApi('/api/users');
    document.getElementById('logout').onclick = () => { localStorage.clear(); location.href='login.html'; };
  </script>
</body>
</html>
